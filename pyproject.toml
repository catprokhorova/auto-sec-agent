[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auto-sec-agent"
version = "0.1.0"
description = "Autonomous CI/CD Security Agent (DevOps / AppSec AI)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Security AI Team" }
]
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "mcp>=1.0.0",
    "boto3>=1.34.0",
    "aiobotocore>=2.13.0",
    "langfuse>=2.30.0",
    "docker>=7.0.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "neo4j>=5.20.0",
    "opensearch-py>=2.6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.4.2",
    "ruff>=0.4.8",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-mock>=3.14.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.cursor
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length handled by black
    "B008", # do not perform function calls in argument defaults (needed for FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
