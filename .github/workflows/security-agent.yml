name: Autonomous Security Remediation

on:
  workflow_run:
    workflows: ["CI Tests and Security Scans"]
    types: [completed]
  workflow_dispatch:
    inputs:
      error_log:
        description: "Error log or test failure output"
        required: true
        type: string

jobs:
  auto_remediate:
    name: Auto Remediate Pipeline Failure
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Agent Dependencies
        run: |
          pip install -r requirements.txt

      - name: Fetch Failed CI Logs
        id: fetch_logs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "${{ github.event.inputs.error_log }}" > failure.log
          else
            gh run view ${{ github.event.workflow_run.id }} --log-failed > failure.log || echo "Pipeline failure" > failure.log
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute Autonomous Security Agent
        run: |
          python -m src.cli run \
            --log-file=failure.log \
            --repo="${{ github.repository }}" \
            --max-loops=3 \
            --verbose
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LANGFUSE_ENABLED: "true"
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
